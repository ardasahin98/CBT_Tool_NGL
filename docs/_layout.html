<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{title}}</title>
    <meta name="description" content="{{description}}">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/docs.css">
    <script src="assets/docs.js" defer></script>
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<header class="topbar">
    <button class="menu-button" type="button" aria-controls="sidebar" aria-expanded="false">Menu</button>
    <a class="brand" href="index.html"><img src="assets/favicon.svg" alt="" width="22" height="22"> CBT Tool <span>docs · v{{version}}</span></a>
    <nav class="toplinks" aria-label="Links">
        <a class="toplink" href="{{repo}}" title="Source code on GitHub"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg><span class="label">GitHub</span></a>
        <a class="open-app" href="{{tool}}" title="Open the CBT Tool"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M2.5 1.8h7l4 4v8.4h-11zM9.5 1.8v4h4M5 8.5h6M5 11h6"/></svg><span class="label">Open the tool</span></a>
    </nav>
</header>
<div class="shell">
    <nav id="sidebar" class="sidebar" aria-label="Documentation">
        {{nav}}
    </nav>
    <main id="content" class="content">
        {{content}}
        {{pager}}
    </main>
</div>
</body>
</html>
